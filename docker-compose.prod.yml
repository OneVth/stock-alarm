services:
  db:
    image: postgres:16-alpine
    container_name: stockalarm-db
    environment:
      POSTGRES_USER: stockalarm_user
      POSTGRES_PASSWORD: qaz123
      POSTGRES_DB: stockalarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockalarm_user -d stockalarm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockalarm-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://stockalarm_user:qaz123@db:5432/stockalarm"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
