# stock-alarm nginx access log 로테이션
# 배치 위치: /etc/logrotate.d/stockalarm-nginx
#
# copytruncate 필수: GoAccess가 로그 파일을 실시간으로 읽으므로
# inode를 유지해야 로테이션 후에도 대시보드 갱신이 끊기지 않는다.
# (자세한 이유는 런북 §10.4 참조)

/home/onev/_projects/stock-alarm-v2/logs/nginx/stockalarm-access.log {
    su root root
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
}
