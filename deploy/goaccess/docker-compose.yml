services:
  # GoAccess: nginx 로그 볼륨을 직접 읽어 실시간 HTML 생성 + WebSocket 서버
  # 파이프/systemd 불필요 — restart 플래그로 stock-alarm처럼 자립.
  goaccess:
    image: allinurl/goaccess:latest
    container_name: goaccess
    restart: unless-stopped
    volumes:
      # stock-alarm이 만든 nginx 로그 볼륨을 읽기 전용으로 공유
      - /home/onev/_projects/stock-alarm-v2/logs/nginx:/srv/logs:ro
      - ./data:/srv/data       # --persist 누적 DB
      - ./report:/srv/report   # 생성된 index.html
    command:
      - "--log-file=/srv/logs/stockalarm-access.log"
      - "--log-format=COMBINED"
      - "-o"
      - "/srv/report/index.html"
      - "--real-time-html"
      - "--ws-url=192.168.55.249:8080/ws"
      - "--port=7890"
      - "--addr=0.0.0.0"
      - "--persist"
      - "--restore"
      - "--db-path=/srv/data"

  # 리포트 전용 nginx: HTML 서빙(:8080) + /ws WebSocket 프록시
  report-nginx:
    image: nginx:stable-alpine
    container_name: goaccess-report
    restart: unless-stopped
    ports:
      - "8080:80"              # 브라우저 접근: http://192.168.55.249:8080
    volumes:
      - ./report:/usr/share/nginx/html:ro
      - ./report-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - goaccess

