# Stock Alarm v2 log rotation
# 배치: sudo cp deploy/logrotate.conf /etc/logrotate.d/stock-alarm
# 배치 후 sudo chown root:root /etc/logrotate.d/stock-alarm
# 검증: sudo logrotate -d /etc/logrotate.d/stock-alarm

/home/*/stock-alarm/logs/*.log {
    monthly
    rotate 6
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
