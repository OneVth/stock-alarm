user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # 로그 포맷 — $uri로 쿼리 파라미터 전역 제외 (OAuth code/state 보호)
    log_format stockalarm '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent"';

    # Cloudflare Tunnel 뒤에서 실제 클라이언트 IP 추출 (Docker bridge network 범위 신뢰)
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Rate limit zone
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    upstream stockalarm_app {
        server app:3000;
    }

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log stockalarm;
        error_log  /var/log/nginx/error.log warn;

        client_max_body_size 1m;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 헬스체크 — rate limit 예외 (UptimeRobot 5분 주기 허용)
        location = /api/health {
            proxy_pass http://stockalarm_app;
        }

        # OAuth / 로그인 — 엄격한 rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://stockalarm_app;
        }

        # 일반 API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://stockalarm_app;
        }

        # 그 외 (페이지, 정적 자원 — Next.js standalone이 서빙)
        location / {
            proxy_pass http://stockalarm_app;
        }
    }
}
