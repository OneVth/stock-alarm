# 로컬 개발 전용. 프로덕션은 docker-compose.prod.yml 사용 (환경변수 분리됨)

services:
  db:
    image: postgres:16-alpine
    container_name: stockalarm-db
    environment:
      POSTGRES_USER: stockalarm_user
      POSTGRES_PASSWORD: qaz123
      POSTGRES_DB: stockalarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockalarm_user -d stockalarm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
